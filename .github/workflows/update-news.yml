name: Update news narratives

# MR-10: collect headlines every 4 hours, classify them, and measure each completed day.
# Hand runs can also backfill Guardian / NYT headlines or US Treasury auctions (from 2015).

on:
  schedule:
    - cron: "23 */4 * * *"    # 00:23, 04:23, ... 20:23 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill a source instead of the normal collection"
        type: choice
        options: ["", "guardian", "nyt", "ust"]
        default: ""
      start:
        description: "Backfill start (YYYY-MM-DD)"
        required: false
        default: "2015-01-01"
      end:
        description: "Backfill end (YYYY-MM-DD, blank = today)"
        required: false
        default: ""
      sources:
        description: "Normal run: only these sources (space separated: official gdelt guardian nyt finnhub ust; blank = all)"
        required: false
        default: ""
      llm_items:
        description: "Max headlines for Claude to classify this run (blank = 3000; raise for the backfill)"
        required: false
        default: ""

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
      NYT_KEY: ${{ secrets.NYT_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_MONTHLY_USD: "4"   # $5 of prepaid credit loaded 12 Nov 2026; raise when more is added
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m pytest -q
        env:
          MOTHERDUCK_TOKEN: ""

      - name: Collect news
        run: |
          if [ -n "${{ inputs.backfill }}" ]; then
            ARGS="--backfill ${{ inputs.backfill }} --start ${{ inputs.start || '2015-01-01' }}"
            if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          else
            ARGS=""
            if [ -n "${{ inputs.sources }}" ]; then ARGS="--sources ${{ inputs.sources }}"; fi
          fi
          python -m helios_data.news_ingest $ARGS

      - name: Classify and measure narratives (rules-1.0)
        run: python -m helios_data.narratives | tee report.md

      - name: Classify and measure narratives with Claude (llm-1.0)
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.llm_items }}" ]; then ARGS="--max-items ${{ inputs.llm_items }}"; fi
          python -m helios_data.narratives_llm $ARGS | tee report_llm.md

      - name: Report in job summary
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -s report_llm.md ]; then printf "\n---\n## Claude method (llm-1.0)\n" >> "$GITHUB_STEP_SUMMARY"; cat report_llm.md >> "$GITHUB_STEP_SUMMARY"; fi
