name: Update market data

on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays 22:17 UTC, after the European and US cash closes
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols (space separated, blank = all)"
        required: false
        default: ""
      timeframes:
        description: "Dukascopy timeframes (space separated, blank = 1d 1h 1m)"
        required: false
        default: ""
      start:
        description: "Re-download from this date (YYYY-MM-DD, blank = continue from last bar)"
        required: false
        default: ""
      skip_ig:
        description: "Skip IG prices this run"
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m pytest -q
        env:
          MOTHERDUCK_TOKEN: ""

      - name: Dukascopy history
        run: |
          ARGS=""
          if [ -n "${{ inputs.symbols }}" ]; then ARGS="$ARGS --symbols ${{ inputs.symbols }}"; fi
          if [ -n "${{ inputs.timeframes }}" ]; then ARGS="$ARGS --timeframes ${{ inputs.timeframes }}"; fi
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          python -m helios_data.dukascopy_ingest $ARGS

      - name: IG daily prices
        if: ${{ !inputs.skip_ig }}
        continue-on-error: true
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACC_TYPE: ${{ secrets.IG_ACC_TYPE }}
        run: python -m helios_data.ig_ingest

      - name: Warehouse status
        if: always()
        run: python -m helios_data.status
