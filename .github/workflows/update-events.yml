name: Update calendar and dividends

on:
  schedule:
    - cron: "47 23 * * 1-5"
  workflow_dispatch:
    inputs:
      only:
        description: "calendar, dividends, or blank for both"
        required: false
        default: ""

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -q
        env:
          MOTHERDUCK_TOKEN: ""
      - name: Economic calendar and dividends
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"; fi
          python -m helios_data.events_ingest $ARGS
