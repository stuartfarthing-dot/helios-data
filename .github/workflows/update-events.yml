name: Update calendar and dividends

on:
  schedule:
    - cron: "47 23 * * 1-5"
  workflow_dispatch:
    inputs:
      only:
        description: "calendar, dividends, or blank for both"
        required: false
        default: ""
      ff_actuals:
        description: "Actual figures: blank = last 14 days, test = one week (measure cost), backfill = Apr 2025 to today"
        required: false
        default: ""

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -q
        env:
          MOTHERDUCK_TOKEN: ""
      - name: Economic calendar and dividends
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="--only ${{ inputs.only }}"; fi
          python -m helios_data.events_ingest $ARGS
      - name: FRED macro series (credit spreads, rates, financial stress)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m helios_data.fred_ingest
      - name: Economic-calendar actual figures (Forex Factory via Apify, pay per event)
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.ff_actuals }}" = "test" ]; then ARGS="--test"; fi
          if [ "${{ inputs.ff_actuals }}" = "backfill" ]; then ARGS="--backfill"; fi
          python -m helios_data.ff_actuals_ingest $ARGS
