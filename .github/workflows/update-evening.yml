name: Evening refresh (today's bars and IG positions)

# Foundations step B2 (first part): load today's bars and Stuart's IG deals and open positions
# before IG's 22:00 UK funding cut, so the evening review (a Claude scheduled task, about 21:25 UK)
# and the dive see today rather than yesterday. Read-only on IG. The full nightly load still runs
# later in update-data.yml.

on:
  schedule:
    - cron: "41 20 * * 1-5"   # weekdays 20:41 UTC (20:41 UK in winter, 21:41 in summer)
  workflow_dispatch:

concurrency:
  group: update-data          # shared with the nightly load, so the two never write at once
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      IG_API_KEY: ${{ secrets.IG_API_KEY }}
      IG_USERNAME: ${{ secrets.IG_USERNAME }}
      IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
      IG_ACC_TYPE: ${{ secrets.IG_ACC_TYPE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m pytest -q
        env:
          MOTHERDUCK_TOKEN: ""

      - name: Today's bars for the traded markets (continues from the last stored bar)
        continue-on-error: true
        run: >
          python -m helios_data.dukascopy_ingest
          --symbols UK100 GER40 US500 NAS100 US30 RUT AUS200 ESP35 FRA40 XAUUSD XAGUSD XPTUSD COPPER BRENT VIX
          --timeframes 1m 15m 1h

      - name: IG deals (last 2 days, read-only)
        continue-on-error: true
        run: python -m helios_data.ig_trades --days 2

      - name: IG open positions snapshot (read-only)
        continue-on-error: true
        run: python -m helios_data.ig_positions

      - name: Warehouse status
        if: always()
        run: python -m helios_data.status
